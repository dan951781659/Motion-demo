<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='motionAdminDemo.v5',PUBKEY='motionAdminDemo.pub.v5';

/* ========== 候选引擎：匹配条件只用来筛候选动作、提醒「待确认」，不决定设备端展示 ========== */
const hasCond=t=>!!(t.f.scene.length||t.f.attr.length||t.f.part.length||t.f.acc.length);
const eligible=a=>a.type==='视频动作'||a.type==='非视频动作';
function condMatch(t,a){
  if(!hasCond(t)||!eligible(a))return false;
  if(t.f.scene.length&&!t.f.scene.includes(a.scene))return false;
  if(t.f.attr.length&&!t.f.attr.includes(a.attr))return false;
  if(t.f.part.length&&!a.parts.some(p=>t.f.part.includes(p)))return false;
  if(t.f.acc.length&&!a.equip.some(e=>t.f.acc.includes(e)))return false;
  return true;
}
const ownerOf=a=>db.templates.find(t=>!t.del&&t.members.includes(a.id));
const pendingOf=t=>db.actions.filter(a=>eligible(a)&&!ownerOf(a)&&condMatch(t,a));
const condText=f=>{
  const p=[];
  if(f.scene.length)p.push('适用场景 ∈ {'+f.scene.join('、')+'}');
  if(f.attr.length)p.push('动作属性 ∈ {'+f.attr.join('、')+'}');
  if(f.part.length)p.push('训练部位 与 {'+f.part.join('、')+'} 有交集');
  if(f.acc.length)p.push('器械含 {'+f.acc.join('、')+'} 之一');
  return p.length?p.join(' 且 '):'未设置条件：筛不出候选，只能手动选择动作';
};

function dlg(title,body,foot,opt){
  opt=opt||{};
  const o=document.createElement('div');o.className='ov'+(opt.l2?' l2':'');
  o.innerHTML=`<div class="dl" style="width:${opt.w||560}px"><div class="dlh"><b>${title}</b><span class="x">×</span></div><div class="dlb">${body}</div>${foot?`<div class="dlf">${foot}</div>`:''}</div>`;
  $('#layers').appendChild(o);o.close=()=>o.remove();o.querySelector('.x').onclick=o.close;return o;
}
function confirmDlg(title,msg,okText,fn){
  const o=dlg(title,`<p style="margin:0">${msg}</p>`,`<button class="btn g" data-c>取消</button><button class="btn p" data-ok>${okText||'确认'}</button>`,{w:420,l2:true});
  o.querySelector('[data-c]').onclick=o.close;o.querySelector('[data-ok]').onclick=()=>{o.close();fn()};
}
const equiv=s=>[...s].reduce((n,c)=>n+(c.charCodeAt(0)<128?.5:1),0);

  </div></div></div>

  bindPager(pageActions);
  $$('[data-m]').forEach(e=>e.onclick=()=>{ui.model=e.dataset.m;ui.pg.actions=1;pageActions()});

  $$('[data-ex]').forEach(e=>e.onclick=()=>{ui.expand[e.dataset.ex]=!ui.expand[e.dataset.ex];pageActions()});

    if(d.w===''||d.w==null)return toast('请输入推荐配重');d.w=+d.w;
    if(src)Object.assign(src,d);else{d.id=Math.max(0,...db.actions.map(x=>x.id))+1;d.status='草稿';db.actions.unshift(d)}
    save();o.close();pageActions();toast('已保存为草稿');
  };
}
function pickEquip(d,host,after){
  const sel=new Set(d.equip);let q={id:'',name:''};
  const body=()=>`<div class="tools"><span>器械ID</span><input type="text" data-q="id" value="${esc(q.id)}" style="width:120px"><span>器械名称</span><input type="text" data-q="name" value="${esc(q.name)}" style="width:120px"><button class="btn p sm" data-s>搜索</button><button class="btn sm" data-r>清空</button></div>
   <table><thead><tr><th></th><th>序号</th><th>器械ID</th><th>器械名称</th></tr></thead><tbody>${EQUIP.filter(e=>(!q.id||String(e[0]).includes(q.id))&&(!q.name||e[1].includes(q.name))).map((e,i)=>`<tr><td><input type="checkbox" data-e="${e[1]}" ${sel.has(e[1])?'checked':''}></td><td>${i+1}</td><td>${e[0]}</td><td>${e[1]}</td></tr>`).join('')}</tbody></table><div class="small muted" style="margin-top:8px">共 ${EQUIP.length} 条（线上真实器械）。</div>`;
  const o=dlg('器械列表',body(),`<button class="btn g" data-c>取消</button><button class="btn p" data-ok>确认</button>`,{w:560,l2:true});
  const bind=()=>{
    o.querySelectorAll('[data-e]').forEach(c=>c.onchange=()=>{c.checked?sel.add(c.dataset.e):sel.delete(c.dataset.e)});
    o.querySelectorAll('[data-q]').forEach(i=>i.oninput=()=>{q[i.dataset.q]=i.value});
    o.querySelector('[data-s]').onclick=()=>{o.querySelector('.dlb').innerHTML=body();bind()};
    o.querySelector('[data-r]').onclick=()=>{q={id:'',name:''};o.querySelector('.dlb').innerHTML=body();bind()};
  };bind();
  o.querySelector('[data-c]').onclick=o.close;
  o.querySelector('[data-ok]').onclick=()=>{d.equip=EQUIP.map(e=>e[1]).filter(n=>sel.has(n));host.querySelector('[data-eqv]').value=d.equip.join('、');o.close();after()};
}
function pickAI(d,host){
  let q={id:'',name:''},pg=1,cur=d.ai;
  const body=()=>{const rows=AI_LIST.filter(r=>(!q.id||String(r[0]).includes(q.id))&&(!q.name||r[1].includes(q.name)));const pages=Math.max(1,Math.ceil(rows.length/10));pg=Math.min(pg,pages);
   return `<div class="tools"><span>ID</span><input type="text" data-q="id" value="${esc(q.id)}" style="width:100px"><span>动作名称</span><input type="text" data-q="name" value="${esc(q.name)}" style="width:140px"><button class="btn p sm" data-s>搜索</button><button class="btn sm" data-r>清空</button></div>
   <table><thead><tr><th></th><th>序号</th><th>ID</th><th>动作名称</th></tr></thead><tbody>${rows.slice((pg-1)*10,pg*10).map((r,i)=>`<tr><td><input type="radio" name="ai" data-a="${r[0]}" ${cur===r[0]?'checked':''}></td><td>${(pg-1)*10+i+1}</td><td>${r[0]}</td><td>${r[0]}_${r[1]}</td></tr>`).join('')}</tbody></table>
   <div class="pg"><span>共 264 条（Demo 列出 ${AI_LIST.length} 条）</span>${[...Array(pages)].map((_,i)=>`<button class="${i+1===pg?'on':''}" data-p="${i+1}">${i+1}</button>`).join('')}</div>`};
  const o=dlg('AI动作列表',body(),`<button class="btn sm g" data-clear style="margin-right:auto">清除关联</button><button class="btn g" data-c>取消</button><button class="btn p" data-ok>确认</button>`,{w:620,l2:true});
  const bind=()=>{
    o.querySelectorAll('[data-a]').forEach(c=>c.onchange=()=>{cur=+c.dataset.a});
    o.querySelectorAll('[data-q]').forEach(i=>i.oninput=()=>{q[i.dataset.q]=i.value});
    o.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{pg=+b.dataset.p;o.querySelector('.dlb').innerHTML=body();bind()});
    o.querySelector('[data-s]').onclick=()=>{pg=1;o.querySelector('.dlb').innerHTML=body();bind()};
    o.querySelector('[data-r]').onclick=()=>{q={id:'',name:''};pg=1;o.querySelector('.dlb').innerHTML=body();bind()};
  };bind();
  o.querySelector('[data-c]').onclick=o.close;
  o.querySelector('[data-clear]').onclick=()=>{cur=null;o.querySelectorAll('[data-a]').forEach(c=>c.checked=false)};
  o.querySelector('[data-ok]').onclick=()=>{d.ai=cur;host.querySelector('[data-aiv]').value=cur!=null?aiName(cur):'';o.close()};
}
</script>
<script>
/* ========== 页面二：安装方案模板（新增页面） ========== */
const MAXC=5;
const PRESETS=[['空白卡片','',''],['更换配件','更换配件','请把配件更换为……'],['放置凳子','放置凳子','请在器械前放置凳子。'],['放置箱体','放置箱体','请把箱体放到普拉提床上。'],['移除箱体','移除箱体','请把箱体从普拉提床上取下。'],['调整卡扣','调整卡扣','请把卡扣调到与肩同高的位置。']];
const mkCard=(title,sub,img)=>({id:nid(),title:title||'',sub:sub||'',img:!!img});
const actName=id=>(db.actions.find(a=>a.id===id)||{}).name||('#'+id);
const vidArt=()=>`<svg viewBox="0 0 160 90" class="vsvg" aria-hidden="true"><rect x="18" y="8" width="10" height="74" rx="3" fill="#2a3b52"/><rect x="132" y="8" width="10" height="74" rx="3" fill="#2a3b52"/><path d="M32 47h96" stroke="#3b82c4" stroke-width="2" stroke-dasharray="4 3"/><g class="vclip"><rect x="13" y="44" width="20" height="7" rx="2" fill="#f5a524"/></g><circle class="vh" cx="132" cy="47" r="7" fill="#e8eef6" stroke="#8aa0b8" stroke-width="2"/></svg><span class="vplay">▶</span>`;
const snapOf=t=>({name:t.name,on:!!t.on,members:[...t.members].sort((a,b)=>a-b),tags:[...t.tags],video:t.video?{name:t.video.name,dur:t.video.dur,poster:!!t.video.poster}:null,cards:t.cards.map(c=>({title:c.title,sub:c.sub,img:!!c.img})),langs:[...t.langs].sort()});
const isDirty=t=>!t.pub||JSON.stringify(snapOf(t))!==JSON.stringify(t.pub);
const tplState=t=>t.del?'待删除':!t.pub?'未发布':isDirty(t)?'有未发布修改':'已发布';
const STC={'已发布':'g','有未发布修改':'y','未发布':'y','待删除':'r'};
function changeSummary(a,b){
  const o=[];
  if(!a){o.push('首次发布：'+b.cards.length+' 张卡片'+(b.video?'、含引导视频':'')+'，'+b.members.length+' 个动作');return o}
  if(a.name!==b.name)o.push('名称：'+a.name+' → '+b.name);
  if(a.on!==b.on)o.push(b.on?'启用':'停用（设备端该模板下的动作直接进入动作详情）');
  const av=a.video?a.video.name:'',bv=b.video?b.video.name:'';
  if(av!==bv)o.push(!av?'新增引导视频':!bv?'删除引导视频':'替换引导视频');
  if(JSON.stringify(a.cards)!==JSON.stringify(b.cards))o.push('卡片：'+(a.cards.length===b.cards.length?a.cards.length+' 张，内容有修改':a.cards.length+' → '+b.cards.length+' 张'));
  if(JSON.stringify(a.tags)!==JSON.stringify(b.tags))o.push('标签有修改');
  const add=b.members.filter(x=>!a.members.includes(x)),rm=a.members.filter(x=>!b.members.includes(x));
  if(add.length)o.push('加入 '+add.length+' 个动作：'+add.map(actName).join('、'));
  if(rm.length)o.push('移出 '+rm.length+' 个动作：'+rm.map(actName).join('、'));
  if(JSON.stringify(a.langs)!==JSON.stringify(b.langs))o.push('翻译语言：'+a.langs.length+' → '+b.langs.length+' 种');
  return o;
}
const nowStr=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())};
const WHO='superadmin';
const logOp=(obj,act,desc)=>{db.log.unshift({t:nowStr(),who:WHO,obj,act,desc});db.log=db.log.slice(0,200)};
function syncPub(){
  try{localStorage.setItem(PUBKEY,JSON.stringify({at:nowStr(),tpls:db.templates.filter(t=>t.pub).map(t=>Object.assign({id:t.id},t.pub)),acts:Object.fromEntries(db.actions.map(a=>[a.id,a.name]))}))}catch(e){}
}
const pickFile=(accept,cb)=>{const i=document.createElement('input');i.type='file';i.accept=accept;i.onchange=()=>{if(i.files&&i.files[0])cb(i.files[0])};i.click()};
const IMG_OK=f=>/^image\/(png|jpe?g|webp)$/.test(f.type)&&f.size<=2*1024*1024;

function devHTML(a,t){
  const head=`<div class="dev"><div class="sb"><span>IP: 192.168.1.100</span><span>15:43</span></div><div class="hd2">训练准备</div>`;
  if(!t)return head+`<div class="pad"><div class="none">${a&&a.name?'未归属任何模板<br>设备端直接进入动作详情':'这里显示训练准备页'}</div></div><div class="btns"><div class="btn2">开始动作</div></div></div>`;
  return head+`<div class="pad"><b style="font-size:12px">${esc(a?.name||t.name)}</b>
   ${t.tags.length?`<div class="tags">${t.tags.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:''}
   ${t.video?`<div class="vid">${vidArt()}<em>${esc(t.video.name)}</em></div>`:''}
   ${t.cards.map((c,i)=>`<div class="card2">${c.img?'<div class="ico"></div>':`<div class="num">${i+1}</div>`}<div><b>${esc(c.title||'（主标题）')}</b><p class="muted" style="margin:0;font-size:9px">${esc(c.sub||'')}</p></div></div>`).join('')}
   </div><div class="btns"><div class="btn2">已完成，开始动作</div></div></div>`;
}
const RULES_HTML=`<div class="hint"><b>怎么用（本期新增）</b>
 <ol><li>新建模板：填<b>训练准备内容</b>（可选引导视频 + 1～5 张自定义卡片），再填<b>匹配条件</b>：适用场景、动作属性、训练部位、配件。</li>
 <li>系统按条件把动作筛成<b>候选</b>，由人工<b>勾选</b>要加入的动作。勾选结果才是模板成员，设备端只认成员关系。</li>
 <li>一个动作只归一个模板；勾选已在别的模板里的动作，会从原模板移过来。没有任何模板的动作，设备端直接进入动作详情。</li>
 <li>条件只用来筛候选和提醒：新建或改了动作后，符合条件但没加入的会在模板上显示「待确认」，不会自动生效。</li>
 <li><b>保存是草稿，发布后设备端才生效</b>（包括停用、删除、成员增减）。所有变更记在操作日志里。</li></ol></div>`;

function condCell(t){
  const row=(k,arr)=>`<span><b>${k}</b>${arr.length?esc(arr.join('、')):'<span class="muted">不限</span>'}</span>`;
  return `<div class="cond">${row('场景',t.f.scene)}${row('属性',t.f.attr)}${row('部位',t.f.part)}${row('配件',t.f.acc)}</div>`;
}
const cardSum=t=>`${t.video?'<i class="tg ai">视频</i> ':''}<b>${t.cards.length}</b> 张：<span class="muted">${esc(t.cards.map(c=>c.title).join(' / '))}</span>`;
function orphanList(){
  const l=db.actions.filter(a=>eligible(a)&&!ownerOf(a));
  const withAcc=a=>a.equip.some(e=>eqKind(e)!=='other');
  return l.map(a=>({a,sug:db.templates.find(t=>t.on&&!t.del&&condMatch(t,a)),acc:withAcc(a)})).sort((x,y)=>(y.acc-x.acc)||(!!y.sug-!!x.sug));
}
const actRow=(a,extra)=>`<tr><td class="l"><b>${esc(a.name)}</b> ${a.status!=='上架'?`<i class="tg">${a.status}</i>`:''}</td><td>${a.models.join(' ')}</td><td>${a.scene}</td><td>${a.attr}</td><td>${esc(a.parts.join('、'))}</td><td>${esc(a.equip.join('、'))}</td>${extra||''}</tr>`;
const ACT_HEAD='<th class="l">动作名称</th><th>适用型号</th><th>适用场景</th><th>动作属性</th><th>训练部位</th><th>器械</th>';

function pageTemplates(){
  if(ui.preview)return previewTpl(ui.preview);
  if(ui.edit&&ui.edit.kind==='tpl')return editTplPage(ui.edit.id);
  const f=ui.tf||'';
  const ts=db.templates;
  const orph=orphanList();
  const pendIds=new Set();ts.forEach(t=>{if(t.on&&!t.del)pendingOf(t).forEach(a=>pendIds.add(a.id))});
  const nDirty=ts.filter(t=>tplState(t)!=='已发布').length;
  const shown=ts.filter(t=>f==='pending'?(t.on&&!t.del&&pendingOf(t).length):f==='dirty'?tplState(t)!=='已发布':f==='orphan'?false:true);
  const showOrph=f===''||f==='orphan';
  const trs=shown.map((t,i)=>{
    const st=tplState(t),pend=t.on&&!t.del?pendingOf(t):[],open=ui.texp[t.id];
    const mem=t.members.map(id=>db.actions.find(a=>a.id===id)).filter(Boolean);
    let h=`<tr class="${t.del?'dimrow':''}"><td><a class="lk" data-tx="${t.id}" style="margin:0 4px 0 0">${open?'⌄':'›'}</a>${i+1}</td><td class="l"><b>${esc(t.name)}</b>${t.langs.length?` <i class="tg">${t.langs.length} 种语言</i>`:''}</td>
     <td class="l">${condCell(t)}</td><td class="l" style="white-space:normal;min-width:200px">${cardSum(t)}</td>
     <td><b>${t.members.length}</b> 个</td><td>${pend.length?`<a class="lk" data-tx="${t.id}" style="margin:0"><i class="tg y">${pend.length} 个</i></a>`:'<span class="muted">—</span>'}</td>
     <td><i class="tg ${STC[st]}">${st}</i></td><td><span class="sw2 ${t.on?'on':''}" data-on="${t.id}"></span></td><td class="small">${t.by}<br><span class="muted">${t.at}</span></td>
     <td class="act">${t.del?`<a data-un="${t.id}">撤销删除</a>`:`<a data-pv="${t.id}">预览</a><a data-te="${t.id}">编辑</a>${st!=='已发布'?`<a class="g" data-pb="${t.id}">发布</a>`:''}<a data-tr="${t.id}">翻译</a><a class="r" data-td="${t.id}">删除</a>`}</td></tr>`;
    if(open)h+=`<tr class="child"><td colspan="10" style="white-space:normal;text-align:left;padding:12px 18px">
      <div class="small muted" style="margin-bottom:6px"><b style="color:var(--t3)">已加入的动作 · ${mem.length}</b>　设备端：这些动作进入训练前显示本模板；动作上架且模板已发布后才出现</div>
      ${mem.length?`<table class="dense"><thead><tr>${ACT_HEAD}<th>操作</th></tr></thead><tbody>${mem.map(a=>actRow(a,`<td class="act"><a class="r" data-rm="${t.id}:${a.id}">移出</a></td>`)).join('')}</tbody></table>`:'<div class="muted small">还没有加入动作。编辑模板，按条件筛出候选并勾选。</div>'}
      ${pend.length?`<div class="small" style="margin:12px 0 6px;color:var(--yt)"><b>待确认 · ${pend.length}</b>　符合本模板条件、还没归属任何模板，不会自动生效</div><table class="dense"><thead><tr>${ACT_HEAD}<th>操作</th></tr></thead><tbody>${pend.map(a=>actRow(a,`<td class="act"><a data-add="${t.id}:${a.id}">加入本模板</a></td>`)).join('')}</tbody></table>`:''}
      <div class="small muted" style="margin-top:12px"><b style="color:var(--t3)">语言版本</b>　${t.langs.length?t.langs.map(c=>`<i class="tg ai">${esc((LANG_ALL.find(x=>x[0]===c)||[c,c])[1])}</i>`).join(' '):'未翻译。设备端按当前语言取译文，缺译文时回退中文。'}</div></td></tr>`;
    return h;
  }).join('');
  const orphOpen=ui.texp.orph||f==='orphan';
  const orphRow=!showOrph?'':`<tr class="orph"><td><a class="lk" data-ox style="margin:0 4px 0 0">${orphOpen?'⌄':'›'}</a>—</td><td class="l" colspan="3"><b>未归属动作</b> <span class="muted small">不在任何模板里的动作；设备端直接进入动作详情</span></td><td><b>${orph.length}</b> 个</td><td colspan="5" class="small muted" style="text-align:left">含配件 / 凳的排在前面，建议先处理</td></tr>`
   +(orphOpen?`<tr class="child"><td colspan="10" style="white-space:normal;text-align:left;padding:12px 18px">${orph.length?`<table class="dense"><thead><tr>${ACT_HEAD}<th>提示</th><th>操作</th></tr></thead><tbody>${orph.map(o=>actRow(o.a,`<td>${o.acc?'<i class="tg y">含配件 / 凳</i> ':''}${o.sug?`<span class="small">建议：${esc(o.sug.name)}</span>`:'<span class="muted small">无符合条件的模板</span>'}</td><td class="act">${o.sug?`<a data-oadd="${o.a.id}:${o.sug.id}">加入建议模板</a>`:''}</td>`)).join('')}</tbody></table>`:'<span class="muted small">所有动作都已归属模板。</span>'}</td></tr>`:'');
  const chip=(k,l,n)=>`<a class="tg ${f===k?'ai':''} lk" data-fl="${k}" style="margin:0;cursor:pointer">${l}${n!=null?' '+n:''}</a>`;
  $('#content').innerHTML=`${LEGEND}${RULES_HTML}
  <div class="stat"><div><b>${ts.length}</b><span>模板</span></div><div><b style="color:var(--green)">${ts.length-nDirty}</b><span>已发布</span></div>
   <div class="click" data-fl="dirty"><b style="color:var(--amber)">${nDirty}</b><span>待发布</span></div>
   <div><b>${ts.reduce((s,t)=>s+t.members.length,0)}</b><span>已加入动作</span></div>
   <div class="click" data-fl="pending"><b style="color:var(--amber)">${pendIds.size}</b><span>待确认动作</span></div>
   <div class="click" data-fl="orphan"><b>${orph.length}</b><span>未归属动作</span></div></div>
  <div class="card"><div class="hd"><h2>安装方案模板</h2>${MK('new','新增页面')}<span class="sp"></span>
   <button class="btn g" id="tlog">操作日志</button><button class="btn" id="pall" ${nDirty?'':'disabled'}>发布全部修改${nDirty?'（'+nDirty+'）':''}</button><button class="btn p" id="tnew">新建模板</button></div>
   <div class="bd" style="padding:10px 16px 0"><div class="tools" style="margin-bottom:8px"><span class="small muted">筛选：</span>${chip('','全部')}${chip('pending','有待确认')}${chip('dirty','有未发布修改')}${chip('orphan','未归属动作')}</div></div>
  <div class="bd tw" style="padding:0"><table><thead><tr><th>序号</th><th class="l">模板名称</th><th class="l">匹配条件（筛候选用）</th><th class="l">训练准备内容</th><th>已加入动作</th><th>待确认</th><th>发布状态</th><th>启用</th><th>修改人 / 时间</th><th>操作</th></tr></thead><tbody>${trs}${orphRow}${!trs&&!showOrph?'<tr><td colspan="10" class="muted">没有符合筛选的模板</td></tr>':''}</tbody></table></div></div>`;
  $$('[data-fl]').forEach(e=>e.onclick=()=>{ui.tf=ui.tf===e.dataset.fl?'':e.dataset.fl;pageTemplates()});
  $('#tnew').onclick=()=>{ui.edit={kind:'tpl',id:null};pageTemplates()};
  $('#tlog').onclick=logDlg;
  $('#pall').onclick=()=>publishDlg(db.templates.filter(t=>tplState(t)!=='已发布'));
  $$('[data-tx]').forEach(e=>e.onclick=()=>{ui.texp[e.dataset.tx]=!ui.texp[e.dataset.tx];pageTemplates()});
  const ox=$('[data-ox]');if(ox)ox.onclick=()=>{ui.texp.orph=!ui.texp.orph;pageTemplates()};
  $$('[data-te]').forEach(e=>e.onclick=()=>{ui.edit={kind:'tpl',id:e.dataset.te};pageTemplates()});
  $$('[data-pv]').forEach(e=>e.onclick=()=>{ui.preview=e.dataset.pv;pageTemplates()});
  $$('[data-pb]').forEach(e=>e.onclick=()=>publishDlg([db.templates.find(t=>t.id===e.dataset.pb)]));

function publishDlg(list,after){
  list=list.filter(Boolean);if(!list.length)return;

    return `<div class="pubitem"><b>${esc(t.name)}</b> <i class="tg ${STC[tplState(t)]}">${tplState(t)}</i><ul>${(s.length?s:['没有可发布的内容变化']).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`}).join('');
  const o=dlg('发布',`<p class="small muted" style="margin-top:0">发布后，设备端在下次同步时拿到新版本；未发布的修改设备端看不到。草稿 / 下架的动作加入模板后，要等动作上架才会在设备端出现。</p>${body}`,`<button class="btn g" data-c>取消</button><button class="btn p" data-ok>确认发布</button>`,{w:600,l2:true});
  o.querySelector('[data-c]').onclick=o.close;
  o.querySelector('[data-ok]').onclick=()=>{
    list.forEach(t=>{if(t.del){db.templates=db.templates.filter(x=>x!==t);logOp(t.name,'发布','删除已生效')}else{const s=changeSummary(t.pub,snapOf(t));t.pub=snapOf(t);t.pubAt=nowStr();logOp(t.name,'发布',s.join('；')||'发布')}});

function ensureTypes(so,lang){
  let t=typesOf(so,lang);if(t)return JSON.parse(JSON.stringify(t));

  return defaultTypes();
}
function translateAI(so){
  if(!typesOf(so,'zh'))return toast('请先配置中文文案，再翻译其他语言');
  LANGS.forEach(([id])=>{if(id!=='zh'&&!typesOf(so,id))db.copy[so+'|'+id]=ensureTypes(so,id)});
  ui.expand['ai'+so]=true;save();pageAI();toast('已按中文的类型结构生成其余演示语言。类型和条数与中文一致。');
}

function flattenCopy(){const out=[];Object.entries(db.copy).forEach(([k,types])=>{const [so,lang]=k.split('|');(types||[]).forEach(tp=>tp.lines.forEach(l=>out.push({so,lang,key:tp.key,name:tp.name,text:l.text,voice:l.voice})))});return out}

var embed=new URLSearchParams(location.search).get('embed')==='1';
if(embed){
  window.addEventListener('message',e=>{
    if(location.protocol!=='file:'&&e.origin!==location.origin)return;
    if(e.data&&e.data.type==='admin-theme'&&e.data.theme)setTheme(e.data.theme,'sync');
    if(e.data&&e.data.type==='admin-nav'&&e.data.page&&CRUMB[e.data.page]){ui.edit=null;ui.preview=null;nav(e.data.page)}
  });
}
const navBase=nav;
nav=function(p,opt){navBase(p,opt);if(embed&&parent!==window)parent.postMessage({type:'admin-page',page:ui.page},location.protocol==='file:'?'*':location.origin)};
nav('actions');
</script>
